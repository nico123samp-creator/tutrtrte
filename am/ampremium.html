<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alight Motion Premium</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    min-height:100vh;
    background:radial-gradient(circle at 90% 8%, rgba(255,35,25,0.13), transparent 25%),
               radial-gradient(circle at 0% 45%, rgba(120,0,0,0.12), transparent 32%),
               linear-gradient(180deg,#090404,#030202 72%);
    font-family:system-ui,-apple-system,sans-serif;
    color:#f5eeee;
    display:flex;
    justify-content:center;
    padding:20px;
  }
  :root {
    --red:#ff3029;
    --red-soft:#ff6259;
    --text:#f5eeee;
    --muted:#9b8c8c;
    --line:rgba(255,55,45,0.22);
    --panel:#100707;
  }
  .container {
    width:100%;
    max-width:520px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:28px;
    padding:26px 22px 30px;
    box-shadow:0 8px 40px rgba(0,0,0,0.5);
    height:fit-content;
    margin-top:20px;
  }
  .badge-unlimited {
    display:inline-block;
    font-size:9px;
    padding:3px 12px;
    border-radius:20px;
    background:rgba(34,197,94,0.15);
    color:#22c55e;
    font-weight:700;
    letter-spacing:1px;
    margin-bottom:12px;
    border:1px solid rgba(34,197,94,0.3);
  }
  h2 {
    font-size:1.15rem;
    font-weight:700;
    color:var(--text);
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  h2 i { color:var(--red); }
  .desc {
    font-size:11px;
    color:var(--muted);
    margin-bottom:16px;
    line-height:1.6;
  }
  .form-group { margin-bottom:12px; }
  .form-group label {
    display:block;
    font-size:10px;
    color:var(--muted);
    margin-bottom:5px;
    letter-spacing:0.5px;
  }
  .v-input {
    width:100%;
    padding:11px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:rgba(255,45,85,0.04);
    color:var(--text);
    font-size:13px;
    outline:none;
    font-family:inherit;
    transition:0.3s;
  }
  .v-input:focus {
    border-color:var(--red);
    box-shadow:0 0 0 3px rgba(255,45,85,0.2);
  }
  .v-input::placeholder { color:#6a5a5a; }
  .v-btn {
    width:100%;
    padding:12px 16px;
    border:none;
    border-radius:12px;
    background:linear-gradient(145deg,#ff3029,#cc1f18);
    color:#fff;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    transition:0.3s;
    font-family:inherit;
    box-shadow:0 4px 30px rgba(255,45,85,0.2);
    margin-top:6px;
    letter-spacing:0.5px;
  }
  .v-btn:hover { transform:scale(1.02); box-shadow:0 8px 40px rgba(255,45,85,0.35); }
  .v-btn:active { transform:scale(0.97); }
  .v-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
  .result-box {
    margin-top:12px;
    padding:14px;
    background:rgba(255,45,85,0.04);
    border:1px solid var(--line);
    border-radius:12px;
    text-align:center;
    font-size:13px;
    line-height:1.5;
  }
  .step { margin-top:12px; }
  .spin { display:inline-block; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* === SUCCESS SCREEN === */
  .success-screen {
    display:none;
    text-align:center;
    padding:24px 10px 10px;
    animation:fadeInUp 0.6s ease;
  }
  .success-screen.show { display:block; }
  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(20px); }
    to { opacity:1; transform:translateY(0); }
  }
  .success-icon {
    width:80px;
    height:80px;
    margin:0 auto 20px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:radial-gradient(circle, rgba(34,197,94,0.25), rgba(34,197,94,0.05));
    border:2px solid rgba(34,197,94,0.5);
    box-shadow:0 0 40px rgba(34,197,94,0.35);
    animation:pulseGlow 2s ease-in-out infinite;
  }
  .success-icon i {
    font-size:38px;
    color:#22c55e;
    filter:drop-shadow(0 0 12px rgba(34,197,94,0.8));
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow:0 0 40px rgba(34,197,94,0.35); }
    50% { box-shadow:0 0 60px rgba(34,197,94,0.6); }
  }
  .success-title {
    font-size:15px;
    line-height:1.7;
    color:#22c55e;
    font-weight:700;
    letter-spacing:1px;
    text-shadow:0 0 20px rgba(34,197,94,0.5);
    margin-bottom:10px;
    word-break:break-word;
  }
  .success-sub {
    font-size:11px;
    color:var(--muted);
    letter-spacing:1px;
    margin-top:8px;
  }
  .success-email {
    display:inline-block;
    margin-top:14px;
    padding:6px 14px;
    border-radius:20px;
    background:rgba(34,197,94,0.08);
    border:1px solid rgba(34,197,94,0.25);
    font-size:11px;
    color:#22c55e;
    word-break:break-all;
  }

  .toast {
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    background:#191919;
    border:1px solid #393939;
    border-radius:12px;
    padding:10px 18px;
    font-size:13px;
    color:#eee;
    transition:0.25s ease;
    z-index:999;
    white-space:nowrap;
  }
  .toast.show { opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<div class="container">
  <div class="badge-unlimited"><i class="fas fa-infinity"></i> UNLIMITED ACCESS</div>

  <h2><i class="fas fa-video"></i> Alight Motion Premium</h2>
  <p class="desc">Aktifkan premium Alight Motion melalui verifikasi email & magic link.</p>

  <!-- STEP 1 -->
  <div id="step1">
    <div class="form-group">
      <label>Email <span style="color:#ef4444;">*</span></label>
      <input type="email" id="amEmail" class="v-input" placeholder="Masukkan email Anda">
    </div>
    <button class="v-btn" id="amSendMagicBtn"><i class="fas fa-envelope"></i> Kirim Magic Link</button>
    <div id="amSendResult" class="result-box" style="display:none;"></div>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="step" style="display:none;">
    <div class="form-group">
      <label>Raw Magic Link <span style="color:#ef4444;">*</span></label>
      <input type="text" id="amRawLink" class="v-input" placeholder="Tempelkan magic link dari email">
    </div>
    <button class="v-btn" id="amVerifyBtn"><i class="fas fa-check-circle"></i> Verifikasi & Aktivasi</button>
    <div id="amVerifyResult" class="result-box" style="display:none;"></div>
  </div>

  <!-- SUCCESS SCREEN -->
  <div id="successScreen" class="success-screen">
    <div class="success-icon"><i class="fas fa-check"></i></div>
    <div class="success-title">𝙰𝙻𝙸𝙶𝙷𝚃 𝙼𝙾𝚃𝙸𝙾𝙽 𝙿𝚁𝙴𝙼𝙸𝚄𝙼 𝙰𝙲𝚃𝙸𝚅𝙴</div>
    <div class="success-sub">PREMIUM SUCCESSFULLY ACTIVATED</div>
    <div class="success-email" id="successEmail">-</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ===========================================
  // ⚙️ ENDPOINT (ubah di sini kalau perlu)
  // ===========================================
  const API_URL = 'https://anita-studio.netlify.app/.netlify/functions/amprem';

  // ===========================================
  // TOAST
  // ===========================================
  const toastEl = document.getElementById('toast');
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  // ===========================================
  // API REQUEST
  // ===========================================
  async function apiRequest(action, data) {
    const payload = { action, ...data };
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // ===========================================
  // STEP 1: Kirim Magic Link
  // ===========================================
  document.getElementById('amSendMagicBtn').onclick = async function() {
    const email = document.getElementById('amEmail').value.trim();
    if (!email) { showToast('Masukkan email!'); return; }

    this.disabled = true;
    this.innerHTML = '<i class="fas fa-spinner spin"></i> Mengirim...';

    const sendResult = document.getElementById('amSendResult');
    sendResult.style.display = 'block';
    sendResult.innerHTML = '<div><i class="fas fa-spinner spin"></i> Mengirim magic link...</div>';

    try {
      const data = await apiRequest('send-magiclink', { email });
      if (data.success) {
        sendResult.innerHTML = '<div style="color:#22c55e;">✅ Magic link dikirim ke <b>' + email + '</b>. Cek email Anda!</div>';
        document.getElementById('step2').style.display = 'block';
        document.getElementById('amVerifyResult').style.display = 'none';
        sendResult.dataset.email = email;
      } else {
        sendResult.innerHTML = '<div style="color:#ef4444;">' + (data.message || 'Gagal mengirim') + '</div>';
      }
    } catch (e) {
      sendResult.innerHTML = '<div style="color:#ef4444;">Error: ' + e.message + '</div>';
    }

    this.disabled = false;
    this.innerHTML = '<i class="fas fa-envelope"></i> Kirim Magic Link';
  };

  // ===========================================
  // STEP 2: Verifikasi & Aktivasi
  // ===========================================
  document.getElementById('amVerifyBtn').onclick = async function() {
    const rawLink = document.getElementById('amRawLink').value.trim();
    const email = document.getElementById('amSendResult').dataset.email
                || document.getElementById('amEmail').value.trim();

    if (!rawLink) { showToast('Tempelkan magic link!'); return; }
    if (!email) { showToast('Email tidak ditemukan, kirim ulang.'); return; }

    this.disabled = true;
    this.innerHTML = '<i class="fas fa-spinner spin"></i> Memverifikasi...';

    const verifyResult = document.getElementById('amVerifyResult');
    verifyResult.style.display = 'block';
    verifyResult.innerHTML = '<div><i class="fas fa-spinner spin"></i> Verifikasi akun...</div>';

    try {
      const verify = await apiRequest('verify-account', { email, rawLink });

      if (verify.success) {
        const idToken = verify.idToken || (verify.profile && verify.profile.idToken);
        if (!idToken) throw new Error('idToken tidak ditemukan');

        verifyResult.innerHTML = '<div style="color:#22c55e;">✅ Verifikasi berhasil! Menerapkan premium...</div>';

        const premium = await apiRequest('apply-premium', { email, idToken });

        if (premium.success) {
          // 🎉 Tampilkan success screen
          document.getElementById('step1').style.display = 'none';
          document.getElementById('step2').style.display = 'none';
          document.getElementById('successScreen').classList.add('show');
          document.getElementById('successEmail').textContent = email;
          showToast('Premium berhasil diaktifkan!');
          return;
        } else {
          verifyResult.innerHTML = '<div style="color:#ef4444;">❌ ' + (premium.message || 'Gagal apply premium') + '</div>';
        }
      } else {
        verifyResult.innerHTML = '<div style="color:#ef4444;">❌ ' + (verify.message || 'Verifikasi gagal') + '</div>';
      }
    } catch (e) {
      verifyResult.innerHTML = '<div style="color:#ef4444;">Error: ' + e.message + '</div>';
    }

    this.disabled = false;
    this.innerHTML = '<i class="fas fa-check-circle"></i> Verifikasi & Aktivasi';
  };
</script>
</body>
</html>
